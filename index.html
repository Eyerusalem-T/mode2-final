<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">Recipe Book</h1>
    <button id="favorites-btn" class="fav-nav" type="button">
       Favorites <span id="fav-count" class="fav-count">0</span>
    </button>
  </header>

  <main class="container">

    <form id="search-form" class="search-bar">
      <input id="search-input" type="search" placeholder="Search recipes by name..." autocomplete="off">
      <button class="btn-primary" type="submit">Search</button>
    </form>

    <p id="message" class="status"></p>

    <div class="layout">
      <section class="panel">
        <h2>All Recipes</h2>
        <div id="recipes" class="grid"></div>
      </section>

      <aside id="favorites-panel" class="panel favorites">
        <h2>Favorites</h2>
        <div id="favorites" class="fav-list"></div>
      </aside>
    </div>

  </main>

  <footer class="site-footer">
    <p>© 2026 Recipe Book. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
